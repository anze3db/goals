{% extends "base.html" %}
{% block title %}Log in · Goals{% endblock title %}
{% block content %}
    <div class="auth">
        <h1 class="display">Log in</h1>
        {% if message %}<p class="message error">{{ message }}</p>{% endif %}
        <form method="post" action="{% url 'login' %}" class="form">
            {% csrf_token %}
            <div class="field">
                <label for="username">Username</label>
                <input id="username"
                       type="text"
                       name="username"
                       autocomplete="username"
                       required />
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password"
                       type="password"
                       name="password"
                       autocomplete="current-password"
                       required />
            </div>
            <div class="actions">
                <button type="submit" class="btn primary">Log in</button>
            </div>
        </form>
    </div>
{% endblock content %}
