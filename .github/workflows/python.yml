name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      SECRET_KEY: something_very_secret
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "latest"
      - name: Install dependencies
        run: uv sync --locked
      - name: Collect static
        run: uv run python manage.py collectstatic --no-input
      - name: Check that workers can run every task
        run: uv run python manage.py check --deploy --tag potatoq
      - name: Run Tests
        run: uv run pytest
        env:
          FLAKYTEST_SECRET_TOKEN: ${{ secrets.FLAKYTEST_SECRET_TOKEN }}
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          bash projects/goals/.deploy/update.sh
    - uses: actions/checkout@v4
      with:
        # The release's commits resolve the Sentry issues they name ("Fixes GOALS-123")
        fetch-depth: 0
    - name: Create Sentry release
      uses: getsentry/action-release@v3
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: anze3db
        SENTRY_PROJECT: goals
      with:
        environment: production
        # settings.RELEASE reports the deployed commit's SHA
        release: ${{ github.sha }}
