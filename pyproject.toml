[project]
name = "goals.pecar.me"
version = "2024"
requires-python = ">=3.15"
dependencies = [
  "django>=6.1",
  "django-environ",
  "django-htmx",
  "django-tui",
  "gunicorn",
  "httpx",
  "potatoq[postgres]>=26.1a8",
  "psycopg[binary]",
  "sentry-sdk",
  "whitenoise",
  # Dev dependencies
  "django-stubs",
  "djlint",
  "flakytest",
  "model-bakery",
  "mypy",
  "pylint",
  "pylint-django",
  "pytest-cov",
  "pytest-django",
  "pytest-watch",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.mypy]
python_version = "3.15"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = "true"

[tool.django-stubs]
django_settings_module = "goals.settings"

[tool.djlint]
ignore="H021"
extend_exclude=".venv,.vscode,.git,.github,htmlcov"

[tool.ruff]
line-length = 140
exclude = [
    ".venv",
    ".vscode",
    ".git",
    ".github",
    "htmlcov",
    "*/migrations/*",
]
target-version = "py315"
fix = true

[tool.ruff.lint]
# Django's Meta.ordering/indexes and ModelForm.Meta.fields are idiomatic mutable class attributes
ignore = ["RUF012"]
